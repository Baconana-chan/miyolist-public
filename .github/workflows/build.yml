name: Build

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Runs on version tags (e.g. v0.2.0) and can also be triggered manually.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release from this build'
        type: boolean
        default: false

permissions:
  contents: write   # needed to create releases and upload assets

jobs:
  # ── Pre-flight: validate WebView2 config (Windows-only concern) ───────────
  preflight:
    name: Pre-flight checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify WebView2 install mode is not "skip" or bare "downloadBootstrapper"
        run: |
          MODE=$(python3 -c "
          import json, sys
          with open('src-tauri/tauri.conf.json') as f:
            cfg = json.load(f)
          windows_cfg = cfg.get('bundle', {}).get('windows', {})
          mode = windows_cfg.get('webviewInstallMode', {})
          if isinstance(mode, dict):
            print(mode.get('type', 'downloadBootstrapper'))
          else:
            print(mode)
          ")
          echo "WebView2 install mode: $MODE"
          if [ "$MODE" = "skip" ]; then
            echo "::error::webviewInstallMode is 'skip' — Windows users without WebView2 will see a crash."
            exit 1
          fi
          if [ "$MODE" = "downloadBootstrapper" ]; then
            echo "::warning::webviewInstallMode is 'downloadBootstrapper' — installer requires internet access."
          fi
          echo "✓ WebView2 config OK ($MODE)"

  # ── Desktop build matrix ──────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform.name }})
    needs: preflight
    runs-on: ${{ matrix.platform.runner }}
    env:
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
      ANILIST_AUTH_URL: ${{ secrets.ANILIST_AUTH_URL }}
      ANILIST_TOKEN_URL: ${{ secrets.ANILIST_TOKEN_URL }}
      ANILIST_GRAPHQL_URL: ${{ secrets.ANILIST_GRAPHQL_URL }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm

          - name: macOS arm64 (Apple Silicon)
            runner: macos-latest         # macos-latest = M-series arm64
            target: aarch64-apple-darwin
            bundles: app,dmg

          - name: macOS x64 (Intel)
            runner: macos-latest         # cross-compile x86_64 from ARM runner
            target: x86_64-apple-darwin
            bundles: app,dmg

    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - name: Clean Rust build cache
        shell: bash
        run: |
          cargo clean --manifest-path src-tauri/Cargo.toml || true
          rm -rf src-tauri/target || true

      # ── Bun + JS deps ─────────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      # ── Linux system dependencies ─────────────────────────────────────────
      - name: Install Linux system dependencies
        if: contains(matrix.platform.runner, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config \
            build-essential \
            file \
            wget

      # ── Rust toolchain ────────────────────────────────────────────────────
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-v2-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/src/**/*.rs') }}
          restore-keys: ${{ runner.os }}-${{ matrix.platform.target }}-cargo-v2-

      # ── WebView2Loader.dll presence check (Windows only) ──────────────────
      - name: Build Rust sidecar (release) — Windows
        if: contains(matrix.platform.runner, 'windows')
        working-directory: src-tauri
        run: cargo build --release --target ${{ matrix.platform.target }}

      - name: Verify WebView2Loader.dll is present — Windows
        if: contains(matrix.platform.runner, 'windows')
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse "src-tauri/target/${{ matrix.platform.target }}/release" `
                   -Filter "WebView2Loader.dll" -ErrorAction SilentlyContinue |
                 Select-Object -First 1
          if ($dll) {
            Write-Host "✓ WebView2Loader.dll found at $($dll.FullName) ($([math]::Round($dll.Length/1KB,1)) KB)"
          } else {
            Write-Host "ℹ WebView2Loader.dll not in Cargo output dir — Tauri bundler will inject it."
          }

      # ── Tauri build ───────────────────────────────────────────────────────
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "MiyoList ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || github.sha }}"
          releaseBody: |
            See the [changelog](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          releaseDraft: true
          prerelease: false
          args: >-
            --target ${{ matrix.platform.target }}
            --bundles ${{ matrix.platform.bundles }}

      # ── Upload artifacts (also available without a release) ───────────────
      - name: Upload installers as workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: miyolist-${{ matrix.platform.name }}
          retention-days: 14
          path: |
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.platform.target }}/release/bundle/macos/*.app

  # ── Android APK (Tauri 2 mobile) ──────────────────────────────────────────
  # Prerequisites before this job will succeed:
  #   1. Run `bun run tauri android init` locally to generate src-tauri/gen/android/
  #   2. Commit the generated Android project to the repository
  #   3. (Optional) Add ANDROID_SIGNING_KEYSTORE and related secrets for a signed APK
  build-android:
    name: Build (Android arm64 APK)
    needs: preflight
    runs-on: ubuntu-latest
    env:
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
      ANILIST_AUTH_URL: ${{ secrets.ANILIST_AUTH_URL }}
      ANILIST_TOKEN_URL: ${{ secrets.ANILIST_TOKEN_URL }}
      ANILIST_GRAPHQL_URL: ${{ secrets.ANILIST_GRAPHQL_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Verify Android SDK tools are available
        run: |
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "Android SDK cmdline-tools found"

      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      - name: Install Android NDK and build tools
        run: |
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;27.0.11902837" \
            "build-tools;35.0.0" \
            "platforms;android-35"

      - name: Export Android NDK toolchain for cargo/cc
        run: |
          TOOLCHAIN="$ANDROID_HOME/ndk/27.0.11902837/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> "$GITHUB_PATH"
          echo "CC_aarch64_linux_android=$TOOLCHAIN/aarch64-linux-android21-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=$TOOLCHAIN/llvm-ar" >> "$GITHUB_ENV"

      - name: Set up Rust toolchain with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: android-cargo-v1-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/src/**/*.rs') }}
          restore-keys: android-cargo-v1-

      - name: Build Android APK
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.0.11902837
        run: bun tauri android build

      - name: Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          APK_IN="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_OUT="src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > miyolist.keystore
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks miyolist.keystore \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass pass:"$ANDROID_STORE_PASSWORD" \
            --key-pass pass:"$ANDROID_KEY_PASSWORD" \
            --out "$APK_OUT" \
            "$APK_IN"
          rm miyolist.keystore
          echo "Signed APK: $APK_OUT"

      - name: Upload Android APK as workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: miyolist-Android-arm64
          retention-days: 14
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-signed.apk

  # ── Optional portable package (Windows) ───────────────────────────────────
  portable-windows:
    name: Build Portable (Windows x64)
    needs:
      - preflight
      - build
    runs-on: windows-latest
    env:
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
      ANILIST_CLIENT_SECRET: ${{ secrets.ANILIST_CLIENT_SECRET }}
      ANILIST_AUTH_URL: ${{ secrets.ANILIST_AUTH_URL }}
      ANILIST_TOKEN_URL: ${{ secrets.ANILIST_TOKEN_URL }}
      ANILIST_GRAPHQL_URL: ${{ secrets.ANILIST_GRAPHQL_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install JS dependencies
        run: bun install

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-x86_64-pc-windows-msvc-portable-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-x86_64-pc-windows-msvc-portable-cargo-

      - name: Build frontend (dist)
        run: bun run build

      - name: Build portable app binary (no installer bundles)
        working-directory: src-tauri
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create portable folder + marker
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/x86_64-pc-windows-msvc/release"
          $outDir = "portable/miyolist-portable-windows-x64"
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null

          Copy-Item "$releaseDir/miyolist.exe" "$outDir/miyolist.exe" -Force
          Get-ChildItem "$releaseDir/*.dll" -ErrorAction SilentlyContinue | ForEach-Object {
            Copy-Item $_.FullName (Join-Path $outDir $_.Name) -Force
          }

          New-Item -ItemType File -Path (Join-Path $outDir "portable.mode") -Force | Out-Null
          "Run miyolist.exe from this folder. 'portable.mode' enables portable data storage near the executable." |
            Set-Content -Path (Join-Path $outDir "README-portable.txt")

      - name: Archive portable package
        shell: pwsh
        run: |
          $zipPath = "portable/miyolist-portable-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "portable/miyolist-portable-windows-x64/*" -DestinationPath $zipPath

      - name: Upload portable package
        uses: actions/upload-artifact@v6
        with:
          name: miyolist-Portable-Windows-x64
          retention-days: 14
          path: portable/miyolist-portable-windows-x64.zip

      - name: Attach portable package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: portable/miyolist-portable-windows-x64.zip
          fail_on_unmatched_files: true
