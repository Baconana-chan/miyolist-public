[package]
name = "miyolist"
version = "2.1.0"
description = "A modern AniList client built with Rust and Tauri."
authors = ["Baconana-chan"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "miyolist_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ── Vendored crates ───────────────────────────────────────────────────────
# proc-macro-error2 is archived upstream (RUSTSEC-2026-0173) and its code
# (pub use of a private `extern crate proc_macro;`) will be rejected by a
# future Rust (rust-lang/rust#127909). We vendor the crate with that one-line
# fix applied; see vendor/proc-macro-error2/README.md.
[patch.crates-io]
proc-macro-error2 = { path = "vendor/proc-macro-error2" }

# Keep the vendored crate out of the workspace so `cargo fmt --all` and
# `cargo clippy` do not reformat/lint third-party code.
[workspace]
exclude = ["vendor/proc-macro-error2"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = { version = "2", features = ["rustls-tls"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "fast-rng"] }
keyring = "3"
discord-presence = "3.2"
quick-xml = "0.37"
time = { version = "0.3", features = ["formatting"] }

